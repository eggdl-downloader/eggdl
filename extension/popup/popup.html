<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EggDL Media Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="brand">
        <img class="logo-img" src="../icons/icon32.png" alt="EggDL" style="width: 24px; height: 24px; object-fit: contain;">
        <div class="brand-text-styled">
          <span class="brand-egg">Egg</span><span class="brand-dl">DL</span>
        </div>
      </div>
      <div class="header-right">
        <select id="ext-theme-selector" class="theme-dropdown-mini" title="Switch Theme">
          <option value="slate">Slate</option>
          <option value="navy">Navy</option>
          <option value="mint">Mint</option>
          <option value="frost">Frost</option>
          <option value="zinc">Zinc</option>
        </select>
        <a href="http://localhost:8000" target="_blank" class="open-dashboard-btn" title="Open Full Dashboard">
          ↗ Open App
        </a>
      </div>
    </header>

    <div class="overlay-control-row">
      <div class="overlay-info">
        <span class="overlay-title">Video Download Overlay</span>
        <span class="overlay-desc">Floating button on video players</span>
      </div>
      <label class="toggle-switch" title="Toggle video download button overlay">
        <input type="checkbox" id="overlay-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <div class="popup-content">
      <div class="page-meta">
        <span id="page-title">Detecting media streams...</span>
        <span class="badge" id="stream-count-badge">0 Streams</span>
      </div>

      <div class="popup-tabs-nav" id="popup-tabs-nav">
        <button type="button" class="popup-tab-btn active" data-tab="video" id="tab-btn-video">
          <span>🎬 Video</span> <span class="tab-count" id="video-tab-count">0</span>
        </button>
        <button type="button" class="popup-tab-btn" data-tab="audio" id="tab-btn-audio">
          <span>🎵 Audio</span> <span class="tab-count" id="audio-tab-count">0</span>
        </button>
      </div>

      <div class="stream-list-container">
        <div class="stream-list" id="stream-list-video">
          <!-- Video items injected here -->
        </div>
        <div class="stream-list" id="stream-list-audio" style="display: none;">
          <!-- Audio items injected here -->
        </div>
      </div>

      <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-icon">🎬</div>
        <p>No media streams detected on this page yet.</p>
        <small>Play a video or audio on the page to capture formats.</small>
      </div>
    </div>

    <footer class="popup-footer">
      <button class="btn btn-secondary" id="sniff-full-btn">Scan Media</button>
      <button class="btn btn-primary" id="download-all-btn">Download Best Quality</button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
